[project]
name = "bi-ai-ui-agent"
version = "0.1.0"
description = "LangGraph agent server for bi-ai-ui (FastAPI + AG-UI /copilotkit endpoint)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "copilotkit==0.1.96",
    "langchain==1.4.0",
    "langchain-openai==1.1.9",
    "langgraph==1.2.11",
    "openai==1.109.1",
    "fastapi>=0.115.5,<1.0.0",
    "httpx>=0.27",  # TestClient transport for pytest
    "uvicorn>=0.29.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # 0.0.44, NOT 0.0.43 — 0.0.43's clone() (called on every request by the
    # fastapi endpoint) forwards enable_legacy_on_interrupt_event and sibling
    # flags unconditionally, which the published copilotkit 0.1.96
    # LangGraphAGUIAgent.__init__ does not accept, so every run 500s.
    # Measured against copilotkit 0.1.96: 0.0.43 FAILS, 0.0.44 OK.
    "ag-ui-langgraph[fastapi]==0.0.44",
    # 0.1.22, NOT an older line: ag-ui-langgraph 0.0.44 requires
    # ag-ui-protocol>=0.1.21, so older pins are unsatisfiable.
    "ag-ui-protocol==0.1.22",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
