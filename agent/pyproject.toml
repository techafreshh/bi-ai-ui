[project]
name = "agent"
version = "0.1.0"
description = "bi-ai-ui LangGraph agent: FastAPI + AG-UI /copilotkit endpoint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "copilotkit==0.1.96",
  "langchain==1.4.0",
  "langchain-openai==1.1.9",
  "langgraph==1.2.11",
  "langsmith==0.7.33",
  "openai==1.109.1",
  "fastapi>=0.115.5,<1.0.0",
  "uvicorn>=0.29.0,<1.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  # 0.0.44, NOT 0.0.43 — matches the official CopilotKit langgraph-fastapi
  # starter's pin and the reason recorded there: ag-ui-langgraph 0.0.43's
  # clone(), which the fastapi endpoint calls on EVERY request, forwards
  # enable_legacy_on_interrupt_event and two sibling flags unconditionally,
  # while the published copilotkit 0.1.96's LangGraphAGUIAgent.__init__ accepts
  # only (name, graph, description, config), so every run 500s. Measured
  # against copilotkit 0.1.96: 0.0.42 OK, 0.0.43 FAILS, 0.0.44 OK, 0.0.45 OK.
  "ag-ui-langgraph[fastapi]==0.0.44",
  # 0.1.22, NOT 0.1.19: ag-ui-langgraph 0.0.44 requires ag-ui-protocol>=0.1.21,
  # so 0.1.19 makes the pin above unsatisfiable. 0.1.22 is also what the
  # official starter's Dockerfile already installs — it pins ag-ui-langgraph
  # and lets ag-ui-protocol resolve transitively — so this closes a second
  # image/local drift rather than opening one.
  "ag-ui-protocol==0.1.22",
  "pydantic>=2.0.0,<3.0.0",
  "pytest>=8.0.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0",
  # Pinned linter for issue #22's `ruff check` gate: `uv sync --frozen`
  # installs it into the image/venv so `uv run ruff check .` works with no
  # extra install step (and `uvx ruff` stays a fallback, never the gate).
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
# Tests import server/graph from the project root (no packaged install).
pythonpath = ["."]
testpaths = ["tests"]
# golden_q3.py (issue #15) and golden_dq.py (issue #17) are issue-named
# files, not test_* glob matches, so they are registered explicitly to stay
# collected by a bare `pytest` run.
python_files = ["test_*.py", "*_test.py", "golden_q3.py", "golden_dq.py"]

[tool.ruff]
# 100 columns matches the repo's existing comment/code width.
line-length = 100

[tool.ruff.lint]
# Error-grade syntax/import hygiene only (E4/E7/E9/F) plus import sorting
# (I): the codebase's long explanatory comments and naming are deliberate
# and must not be reflowed by a formatter rule.
select = ["E4", "E7", "E9", "F", "I"]
