services:
  agent:
    build: ./agent
    ports:
      # Host port is env-driven (AGENT_HOST_PORT) so remapped sandboxes and
      # parallel stacks do not collide; the container port stays pinned.
      - "${AGENT_HOST_PORT:-8123}:8123"
    # env_file is the whole env passthrough (issue #19): every variable in
    # agent/.env reaches the container as-is — models, threshold, bind
    # address — and an edit applies via `docker compose up -d agent`
    # (container recreate, no image rebuild). Boot is DB-less by contract
    # (issue #70): no seeding happens here — /health stays green with no
    # dataset and read_state degrades instead of raising.
    # Long syntax with required: false so the agent still boots (and keeps
    # /health on 200) without agent/.env — only chat needs the key.
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      # Browser origin allowed by CORS; must match where the SPA is served.
      SPA_ORIGIN: ${SPA_ORIGIN:-http://localhost:5173}
    # agent/db.py:DEFAULT_DB_PATH resolves from the file location, never
    # the cwd: parents[1]/data/app.db. In-container db.py is /app/db.py
    # (WORKDIR /app), so the path is /data/app.db — this bind mount is for
    # future sandbox datasets only (issue #71); boot itself never creates one.
    volumes:
      - ./data:/data
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["uv", "run", "--no-sync", "python", "server.py"]
    # Stdlib-only probe (no new packages): same {"status": "ok"} contract
    # as agent/tests/test_server.py:test_health_returns_exact_contract.
    # Port reads AGENT_PORT/HOST fallback exactly like server.py:main.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request,json;p=int(os.getenv('AGENT_PORT') or os.getenv('PORT') or '8123');d=json.loads(urllib.request.urlopen(f'http://localhost:{p}/health',timeout=5).read());assert d=={'status':'ok'}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    environment:
      # Vite inlines VITE_* at dev-server startup. This is the agent endpoint
      # the BROWSER calls, so with remapped ports it must name the host port.
      VITE_AGENT_URL: ${VITE_AGENT_URL:-http://localhost:8123/copilotkit}
    depends_on:
      agent:
        condition: service_healthy
    # Vite dev server (web/vite.config.ts pins host 0.0.0.0:5173 strictPort);
    # node is guaranteed in this image, so no new package is needed.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
