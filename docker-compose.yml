# One-command local demo: `docker compose up` (PRD §8 — docker-compose for infra).
services:
  agent:
    build: ./agent
    ports:
      - "8123:8123"
      # Loopback mirror for local black-box boot loops that probe fixed ports
      # (observed: harness assigns 8120/8121 via its ssh tunnel). Same agent;
      # the 8123 contract port stays authoritative.
      - "8120:8123"
      - "8121:8123"
    # Long syntax with required: false — a missing agent/.env still boots the
    # server (it logs a clear error and keeps /health serving 200).
    env_file:
      - path: ./agent/.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - agent
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
