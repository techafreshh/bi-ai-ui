services:
  agent:
    build: ./agent
    ports:
      - "8123:8123"
    # env_file is the whole env passthrough (issue #19): every variable in
    # agent/.env reaches the container as-is — models, threshold, bind
    # address — and an edit applies via `docker compose up -d agent`
    # (container recreate, no image rebuild). Deliberately no `environment:`
    # block pinning key values: the only `environment:` entry is
    # RESEED=${RESEED:-0}, which has no secret content and defaults to 0
    # so normal boot only seeds when data/app.db is absent
    # (RESEED=1 forces regeneration, the --reseed path).
    # Long syntax with required: false so the agent still boots (and keeps
    # /health on 200) without agent/.env — only chat needs the key.
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      RESEED: ${RESEED:-0}
    # agent/db.py:DEFAULT_DB_PATH resolves from the file location, never
    # the cwd: parents[1]/data/app.db. In-container db.py is /app/db.py
    # (WORKDIR /app), so the path is /data/app.db — this bind mount lands
    # the seeded DB on the host's repo-root data/app.db.
    volumes:
      - ./data:/data
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["uv", "run", "--no-sync", "python", "server.py"]
    # Stdlib-only probe (no new packages): same {"status": "ok"} contract
    # as agent/tests/test_server.py:test_health_returns_exact_contract.
    # Port reads AGENT_PORT/HOST fallback exactly like server.py:main.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request,json;p=int(os.getenv('AGENT_PORT') or os.getenv('PORT') or '8123');d=json.loads(urllib.request.urlopen(f'http://localhost:{p}/health',timeout=5).read());assert d=={'status':'ok'}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      agent:
        condition: service_healthy
    # Vite dev server (web/vite.config.ts pins host 0.0.0.0:5173 strictPort);
    # node is guaranteed in this image, so no new package is needed.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
