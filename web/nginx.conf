# Issue #88: static-only prod serve — dist/ via nginx, SPA fallback, no Node.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Issue #88: SPA fallback — every non-file route serves index.html so
    # deep links and /nonexistent-route return the canvas root.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Issue #88: hashed vite assets are immutable — cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
