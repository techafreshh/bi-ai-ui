# Static SPA server on the pinned port 5173 (contract: SPA at localhost:5173).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM/woff2/MIME defaults are fine; SPA fallback keeps deep links on index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
